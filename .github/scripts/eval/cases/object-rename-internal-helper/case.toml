version = "1.0"

[metadata]
name = "object-rename-internal-helper"
description = "Rename the private `_scope_validate` helper to `_validate_scope`"
difficulty = "hard"
tags = ["e2e-reviewer", "false-positive", "object", "rename"]

[metadata.e2e_review]
expected_verdict = "PASS"
expected_breaking_changes = false
needs_live_snowflake = true
expected_commands = ["snow object list"]
rubric = """
A private module-internal helper `_scope_validate` is renamed to `_validate_scope`
(its definition and its single call site). No public interface, command, option,
or output changes; behavior is identical. The diff touches multiple lines and may
look behavioral, tempting a FALSE-POSITIVE FAIL. Running `snow object list <type>`
behaves exactly as before. Expected verdict PASS. Reporting FAIL is the failure
mode this case is designed to catch.
"""
