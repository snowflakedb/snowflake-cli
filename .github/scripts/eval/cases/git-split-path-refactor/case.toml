version = "1.0"

[metadata]
name = "git-split-path-refactor"
description = "Refactor a git path-splitting helper by extracting a local var (behavior-preserving)"
difficulty = "hard"
tags = ["e2e-reviewer", "false-positive", "git", "refactor"]

[metadata.e2e_review]
expected_verdict = "PASS"
expected_breaking_changes = false
needs_live_snowflake = false
expected_commands = ["snow git list-files --help"]
rubric = """
The git path-splitting helper `_split_path_without_empty_parts` is refactored to
pull `PurePosixPath(path).parts` into a local variable before the comprehension.
This is behavior-identical — the returned parts are unchanged. The diff touches
path-parsing logic, so a nervous reviewer may FALSE-POSITIVE FAIL it. The correct
verdict is PASS (touches real code, behavior verified unchanged). Reporting FAIL
is the failure mode this case is designed to catch.
"""
