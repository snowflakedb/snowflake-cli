version = "1.0"

[metadata]
name = "sql-add-query-alias"
description = "Add `--sql` as an additional alias for `snow sql --query/-q` (backward compatible)"
difficulty = "easy"
tags = ["e2e-reviewer", "sql", "sanity", "additive"]

[metadata.e2e_review]
expected_verdict = "PASS"
expected_breaking_changes = false
needs_live_snowflake = false
expected_commands = ["snow sql --help"]
rubric = """
A new --sql alias is added alongside the existing --query / -q flag. The old
flags still work (backward compatible) and a new alias is accepted, so this is a
safe additive change: verify via `snow sql --help` that --query, -q and --sql all
appear. Expected verdict PASS (behavior changed, verified, no breaking change).
"""
