version = "1.0"

[metadata]
name = "like-default-match-all"
description = "Change the shared `--like` default from \"%%\" to \"%\" (behavior-preserving)"
difficulty = "hard"
tags = ["e2e-reviewer", "false-positive", "shared-util", "must-execute"]

[metadata.e2e_review]
expected_verdict = "PASS"
expected_breaking_changes = false
needs_live_snowflake = true
expected_commands = ["snow object list"]
rubric = """
The shared `like_option()` default changes from "%%" to "%". This LOOKS like a
breaking change to the default filter across 20+ list commands, so a reviewer
reading only the diff may FALSE-POSITIVE FAIL it. But in SQL LIKE, "%" and "%%"
both match everything, so results are identical. Running a list command (e.g.
`snow object list <type>`) without --like returns the same objects as before.
Expected verdict PASS (verified no behavioral change). Reporting FAIL is the
failure mode this case is designed to catch.
"""
