name: Mirror custom branches to public

on:
  push:
    branches:
      # Allowlist — keep in sync with the workflow_dispatch `branch` options and
      # CUSTOM_BRANCHES in the run step below.
      # - example-branch
      - dcm-early-access
      - dcm-early-access-improvements
      - code
  workflow_dispatch:
    inputs:
      branch:
        description: 'Custom branch to mirror'
        type: choice
        options:
          - dcm-early-access
          - dcm-early-access-improvements
          - code
        default: dcm-early-access
      dry_run:
        description: 'Dry run (no actual changes pushed)'
        type: boolean
        default: false

concurrency:
  group: mirror-branch-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v1
        id: mirror-token
        with:
          app-id: ${{ secrets.MIRRORING_APP_ID }}
          private-key: ${{ secrets.MIRRORING_APP_PRIVATE_KEY }}
          owner: snowflakedb
          repositories: snowflake-cli

      - name: Load config
        run: |
          source scripts/mirroring/lib/config.sh
          echo "COPYBARA_RELEASE=${COPYBARA_RELEASE}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: scripts/mirroring/copybara
          push: false
          load: true
          tags: copybara:local
          build-args: |
            COPYBARA_RELEASE=${{ env.COPYBARA_RELEASE }}

      - name: Run mirror-branch.sh
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          MIRROR_GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          # Allowlist — keep in sync with on.push.branches and the
          # workflow_dispatch `branch` options above.
          CUSTOM_BRANCHES=(
            "dcm-early-access"
            "dcm-early-access-improvements"
            "code"
          )

          # On push, mirror the pushed branch (github.ref_name). On manual
          # workflow_dispatch, mirror the chosen branch (inputs.branch) instead
          # of the dispatch ref, which defaults to main — not a custom branch,
          # so it would always fail the allowlist check below.
          branch="${{ inputs.branch || github.ref_name }}"

          branch_allowed=false
          for b in "${CUSTOM_BRANCHES[@]+"${CUSTOM_BRANCHES[@]}"}"; do
            [[ "${b}" == "${branch}" ]] && branch_allowed=true && break
          done
          if [[ "${branch_allowed}" == false ]]; then
            echo "ERROR: '${branch}' is not in CUSTOM_BRANCHES allowlist" >&2
            printf '  valid branches: %s\n' "${CUSTOM_BRANCHES[@]+"${CUSTOM_BRANCHES[@]}"}" >&2
            exit 1
          fi

          args=(--branch "${branch}")
          [[ "${{ inputs.dry_run }}" == "true" ]] && args+=(--dry-run)
          bash scripts/mirroring/mirror-branch.sh "${args[@]}"
