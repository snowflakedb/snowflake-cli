name: Testing

on:
  pull_request:
    branches:
      - "**"
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
    branches:
      - main
      - features/*

env:
  TERM: unknown # Disables colors in rich

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  define-matrix:
    uses: ./.github/workflows/matrix.yaml
  changes:
    uses: ./.github/workflows/changes.yaml
  # Required check `tests (<os>, <py>)` must report on every PR, including
  # docs/CODEOWNERS-only ones. A job-level `if:` on a matrix job prevents the
  # matrix from expanding, so the per-cell required checks are never posted
  # and the PR sits BLOCKED. Keep the gate at the step level instead — the
  # matrix still expands and each cell posts a (no-op) success.
  tests:
    needs: [define-matrix, changes]
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.define-matrix.outputs.os) }}
        python-version: ${{ fromJSON(needs.define-matrix.outputs.python) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'true'
        name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Key on the resolved CPython patch (3.10.21 vs 3.10.22). Prefix
      # restore-keys of `py3.10-` reused a venv whose interpreter was gone,
      # so hatch skipped create and `python -m pytest` hit the runner Python.
      - if: needs.changes.outputs.code == 'true'
        name: Cache hatch envs
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/hatch
            ~/Library/Application Support/hatch
            ~\AppData\Local\hatch
          key: hatch-default-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'pylock.toml') }}
      - if: needs.changes.outputs.code == 'true'
        name: Install hatch
        shell: bash
        env:
          HATCH_ENV: default
        run: |
          python -m pip install -U click==8.2.1 hatch==1.15.1 virtualenv==20.39.1
          python -m hatch env create "$HATCH_ENV"
          probe() {
            python -m hatch run "${HATCH_ENV}:python" -c "import pytest, sys; assert sys.prefix != sys.base_prefix"
          }
          if ! probe; then
            echo "Hatch env '${HATCH_ENV}' is missing pytest; recreating (likely a CPython-patch cache mismatch)" >&2
            python -m hatch env remove "$HATCH_ENV" || true
            python -m hatch env create "$HATCH_ENV"
            probe
          fi
      - if: needs.changes.outputs.code == 'true' && runner.os != 'Windows'
        name: Verify real OAuth authentication contract
        run: hatch run python -m pytest tests/ai/test_oauth_authentication_flow.py tests/ai/test_oauth.py::test_shipping_connector_meets_minimum -q
      - if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: needs.changes.outputs.code == 'true'
        name: Test bundled OAuth plugin
        run: node --test tests/ai/test_opencode_oauth.mjs
      - if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        name: Verify installed wheel OAuth plugin
        run: |
          hatch build -t wheel
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --no-deps dist/*.whl
          .wheel-test/bin/python -I scripts/check_ai_wheel.py
      # Coverage instrumentation roughly doubles unit-test wall time, so run it
      # on a single cell (ubuntu-latest / 3.10) and run the rest of the matrix
      # without it. The job name — and therefore the required check
      # `tests (<os>, <py>)` — is unchanged; only the step internals differ.
      - if: needs.changes.outputs.code == 'true' && (matrix.os != 'ubuntu-latest' || matrix.python-version != '3.10')
        name: Test with hatch
        run: hatch run test
      - if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        name: Test with hatch (with coverage)
        run: hatch run test-cov
      - if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24

