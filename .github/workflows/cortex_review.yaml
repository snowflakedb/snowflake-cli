name: Cortex AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Authorization gate. Runs before the privileged review job (which holds the
  # Snowflake secrets) and blocks it unless every condition holds. Because the
  # review job `needs:` this one, the secret-bearing job never starts for an
  # unauthorized trigger.
  authorize:
    # Declarative pre-filters:
    # - same-repo only (forks can't reach secrets)
    # - not a draft
    # - opt-out label 'disable-ai-e2e-review' must not be present
    # - 'unlabeled' events only proceed when 'disable-ai-e2e-review' was removed
    #   (re-enabling the review); other label removals are ignored
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'disable-ai-e2e-review') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'disable-ai-e2e-review')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Authorized"

  cortex-review:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build CLI from PR branch
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install Cortex Code CLI
        run: curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh

      - name: Run Cortex E2E review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_HOST: ${{ secrets.SNOWFLAKE_HOST }}
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_USER: ${{ secrets.E2E_PR_REVIEWER_USER }}
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_PRIVATE_KEY_RAW: ${{ secrets.E2E_PR_REVIEWER_PRIVATE_KEY_RAW }}
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_WAREHOUSE: ${{ secrets.E2E_PR_REVIEWER_WAREHOUSE }}
          SNOWFLAKE_CONNECTIONS_E2EREVIEWER_ROLE: ${{ secrets.E2E_PR_REVIEWER_ROLE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          CORTEX_MODEL: claude-opus-4-6
        run: python .github/scripts/cortex_e2e_review.py
