name: Mirror single tag to public

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to mirror (e.g. dcm-early-access)'
        type: string
        required: true
      branch:
        description: 'Branch to search on the mirror for the tagged commit (e.g. dcm-early-access-improvements)'
        type: string
        required: true
      update:
        description: 'Update the tag on the mirror if it already exists'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no actual changes pushed)'
        type: boolean
        default: false

concurrency:
  group: mirror-tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v1
        id: mirror-token
        with:
          app-id: ${{ secrets.MIRRORING_APP_ID }}
          private-key: ${{ secrets.MIRRORING_APP_PRIVATE_KEY }}
          owner: snowflakedb
          repositories: snowflake-cli

      - name: Mirror tag
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          MIRROR_GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_UPDATE: ${{ inputs.update }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("${INPUT_TAG}" --branch "${INPUT_BRANCH}")
          [[ "${INPUT_UPDATE}"  == "true" ]] && args+=(--update)
          [[ "${INPUT_DRY_RUN}" == "true" ]] && args+=(--dry-run)
          bash scripts/mirroring/mirror-tag.sh "${args[@]}"
