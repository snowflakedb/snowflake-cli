definition_version: 2
mixins:
  snowpark_shared:
    stage: "dev_deployment"
    signature: ""
    returns: string
    artifact_repository: snowflake.snowpark.pypi_shared_repository
    artifact_repository_packages:
      # snowflake-snowpark-python is deliberately not declared here: app.py imports it
      # and requirements.txt asks for it, which is the state a project migrating to an
      # artifact repository starts from. --skip-dependencies does not read
      # requirements.txt, so the test that uses this project has to declare it.
      - 'dummy-pkg-for-tests'
    artifacts:
      - "app.py"

entities:
  test_procedure:
    type: "procedure"
    identifier:
      name: "test_procedure"
    handler: "app.test_procedure"
    meta:
      use_mixins:
        - "snowpark_shared"

  test_function:
    type: "function"
    handler: "app.test_function"
    identifier:
      name: "test_function"
    meta:
      use_mixins:
        - "snowpark_shared"
