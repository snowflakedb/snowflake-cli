definition_version: 2
mixins:
  snowpark_shared:
    stage: "dev_deployment"
    signature: ""
    returns: string
    artifact_repository: snowflake.snowpark.pypi_shared_repository
    artifact_repository_packages:
      # snowflake-snowpark-python is required by test_procedure and has to be
      # declared here: with artifact_repository set, packages resolved from
      # Anaconda during build are not sent to Snowflake.
      - 'snowflake-snowpark-python'
      - 'dummy-pkg-for-tests'
    artifacts:
      - "app.py"

entities:
  test_procedure:
    type: "procedure"
    identifier:
      name: "test_procedure"
    handler: "app.test_procedure"
    meta:
      use_mixins:
        - "snowpark_shared"

  test_function:
    type: "function"
    handler: "app.test_function"
    identifier:
      name: "test_function"
    meta:
      use_mixins:
        - "snowpark_shared"
