definition_version: 2
mixins:
  snowpark_shared:
    stage: "dev_deployment"
    signature: ""
    returns: string
    artifact_repository: snowflake.snowpark.pypi_shared_repository
    # No artifact_repository_packages: requirements.txt of the project declares
    # what the repository has to install.
    artifacts:
      - "app.py"

entities:
  test_procedure:
    type: "procedure"
    identifier:
      name: "test_procedure"
    handler: "app.test_procedure"
    meta:
      use_mixins:
        - "snowpark_shared"

  test_function:
    type: "function"
    handler: "app.test_function"
    identifier:
      name: "test_function"
    meta:
      use_mixins:
        - "snowpark_shared"
