id: snowflake-cli-rules-rules
friendly_name: "Snowflake CLI - review rules"
status: enabled
allowed_folders: []
excluded_folders: []
allowed_file_extensions:
  - ".yaml"
rules:
  - id: snowflake-cli-rules-prefix
    rule: |
      **SCOPE**: This rule applies ONLY to ArcticOwl ruleset files — `.yaml` files located directly under `.ai/review/` (e.g. `.ai/review/snowflake-cli-markdown-rules.yaml`). Files in subdirectories of `.ai/review/` (such as `*-test/` folders containing test fixtures) and all other YAML files in the repository must not be reviewed by this rule. If the file does not match this description, make no comments and stop.

      **OBJECTIVE**: Snowflake CLI rules need to be easy to find in reporting, thus they need consistent prefixing.

      **REQUIREMENT**: Rule files have a top-level `id` field and an `id` field on each entry
      under `rules:`. Both must start with `snowflake-cli-`.

      ❌ **BAD:**
      ```yaml
      id: snowcli-bad-rules
      friendly_name: "Snowflake CLI - review rules"
      allowed_file_extensions:
        - ".yaml"
      rules:
        - id: snowflakecli-bad-nested-rule
          rule: |
      ```

      ✅ **GOOD:**
      ```yaml
      id: snowflake-cli-good-rules
      friendly_name: "Snowflake CLI - review rules"
      allowed_file_extensions:
        - ".yaml"
      rules:
        - id: snowflake-cli-good-nested-rule
          rule: |
      ```
