id: snowflake-cli-coding-rules
friendly_name: "Snowflake CLI - Coding Rules"
status: shadow
allowed_folders:
  - "src/"
excluded_folders: []
allowed_file_extensions:
  - ".py"
rules:
  - id: snowflake-cli-sql-injection-prevention
    status: enabled
    rule: |
      **OBJECTIVE**: Prevent SQL injection when building Snowflake SQL from identifiers,
      config values, or other externally-influenced input.

      **REQUIREMENT**: Never f-string-interpolate raw identifiers or values into SQL. Wrap
      object identifiers with `FQN.sql_identifier` / `to_identifier` / `to_quoted_identifier`,
      quote string values with `to_string_literal()`, escape `SHOW ... LIKE` patterns with
      `identifier_to_show_like_pattern`, and use bind parameters (`%s`) for DML/`CALL`. Never
      hand-roll escaping such as `value.replace("'", "\\'")`. Apply the safe form consistently
      to every interpolated component (warehouse, compute pool, role, alias, EAI names), not
      just one. All helpers live in `snowflake.cli.api.project.util`.

      When doing `SHOW … LIKE` to look up a **specific object by name** (not a user search
      pattern), use `identifier_to_show_like_pattern()` — it also escapes `%` and `_` wildcards
      so `'my_db'` does not accidentally match `'myXdb'`.

      ❌ **BAD:**
      ```python
      query = f'EXECUTE DCM PROJECT {project_id} PURGE AS "{alias}"'
      cursor.execute(f"CALL SYSTEM$GET_TOKEN('{fqn}', false)")
      set_properties.append(f"QUERY_WAREHOUSE = {self.model.query_warehouse}")
      cursor.execute(f"SHOW INTEGRATIONS LIKE '{name}%'")
      ```

      ✅ **GOOD:**
      ```python
      from snowflake.cli.api.project.util import (
          identifier_to_show_like_pattern,
          to_identifier,
          to_string_literal,
      )

      query = f"EXECUTE DCM PROJECT {project_id.sql_identifier} PURGE"
      if alias:
          query += f" AS {to_string_literal(alias)}"
      cursor.execute("CALL SYSTEM$GET_TOKEN(%s, false)", (fqn,))
      set_properties.append(f"QUERY_WAREHOUSE = {to_identifier(self.model.query_warehouse)}")
      cursor.execute(f"SHOW INTEGRATIONS LIKE {identifier_to_show_like_pattern(name)}")
      ```

  - id: snowflake-cli-feature-flag-no-internal-ids
    status: shadow
    rule: |
      **OBJECTIVE**: Feature flag names must use descriptive, capability-focused names that are
      safe to expose publicly. They must not embed internal tracking identifiers.

      **REQUIREMENT**: Both the Python enum member name and the string argument passed to
      `BooleanFlag(...)` must describe what the feature does, not reference internal tickets,
      issue numbers, or system parameter names. Specifically, flag names must not contain:
      - Numeric sequences of 4 or more digits that represent issue or tracking IDs
        (e.g., `3659937`, `12345`)
      - Prefixes or segments that identify an internal fix or issue reference, such as
        `FIX_`, `SNOW_<digits>`, or any pattern of the form `_<digits>_`

      Flag names are exposed to users as environment variable names
      (`SNOWFLAKE_CLI_FEATURES_<NAME>`) and appear in help output and documentation.
      Embedding internal identifiers leaks implementation details and is confusing to
      external users.

      ❌ **BAD:**
      ```python
      ENABLE_FIX_3659937_DBT_PROJECTS_PROFILES_FILE = BooleanFlag(
          "ENABLE_FIX_3659937_DBT_PROJECTS_PROFILES_FILE", False
      )
      ENABLE_SNOW_12345_SPCS_BUILD_IMAGE = BooleanFlag(
          "ENABLE_SNOW_12345_SPCS_BUILD_IMAGE", False
      )
      ```

      ✅ **GOOD:**
      ```python
      ENABLE_DBT_PROJECTS_PROFILES_FILE_PRECEDENCE = BooleanFlag(
          "ENABLE_DBT_PROJECTS_PROFILES_FILE_PRECEDENCE", False
      )
      ENABLE_SPCS_BUILD_IMAGE = BooleanFlag("ENABLE_SPCS_BUILD_IMAGE", False)
      ```

  - id: snowflake-cli-securepath-for-file-io
    status: shadow
    rule: |
      **OBJECTIVE**: Ensure all file reads and writes use `SecurePath`, which provides an audit trail
      (every operation is logged at INFO level) and restrictive permissions (0600) for created files.

      **REQUIREMENT**: Use `SecurePath` from `snowflake.cli.api.secure_path` whenever reading or
      writing file **content** in source code. `pathlib.Path` remains acceptable for pure path
      manipulation (joining segments, checking suffixes, building paths) but must not be used for
      `.read_text()`, `.read_bytes()`, `.write_text()`, `.write_bytes()`, or `pathlib.Path.open()`
      in `src/snowflake/cli/`. For binary I/O, use `SecurePath.open("rb", read_file_limit_mb=...)`
      as a context manager — `SecurePath` has no `.read_bytes()` shorthand (note: the parameter is
      `read_file_limit_mb` here, vs `file_size_limit_mb` for `read_text()`).

      **DO NOT FLAG:**
      - `Path("foo") / "bar"` — pure path construction
      - `Path("foo").suffix`, `.stem`, `.parent`, `.name` — attribute access only
      - `Path("foo").exists()`, `.is_file()`, `.is_dir()` — stat/existence checks
      - Code that already uses `SecurePath`
      - Test files (`tests/`, `tests_integration/`) — test utilities may use `pathlib.Path`

      **WHAT TO FLAG:**
      - `Path(...).read_text(...)` / `.read_bytes()` / `.write_text()` / `.write_bytes()` in source
      - `pathlib.Path(...).open(...)` for reading/writing file content in source code
      - `open(some_path, ...)` (bare built-in) for reading/writing file content in source code

      ❌ **BAD:**
      ```python
      from pathlib import Path
      content = Path("config.yml").read_text()
      Path("output.json").write_text(json.dumps(data))
      ```

      ✅ **GOOD:**
      ```python
      from snowflake.cli.api.secure_path import SecurePath
      content = SecurePath("config.yml").read_text(file_size_limit_mb=1)
      SecurePath("output.json").write_text(json.dumps(data))
      ```

  - id: snowflake-cli-use-cli-error-not-click-exception
    status: enabled
    rule: |
      **OBJECTIVE**: Prevent `click.ClickException` from being introduced in new or modified
      code. The project uses the `CliError` hierarchy, which provides structured exit-codes and
      typed subclasses that carry more context than a bare `ClickException`.

      **REQUIREMENT**: Raise `CliError` or one of its subclasses instead of
      `click.ClickException` or `ClickException`. When a change already touches a line that
      raises `ClickException`, migrate that raise in the same PR. Choose the most specific
      subclass for the situation — subclasses and their intended use are in
      `src/snowflake/cli/api/exceptions.py`:

      - `CliArgumentError` — bad CLI argument or input value
      - `CliConnectionError` — cannot establish or use a Snowflake connection
      - `CliCommunicationError` — network or protocol error after connection
      - `CliSqlError` — SQL execution failure
      - `CliError` — generic, when no specific subclass fits

      Do not introduce new `ClickException` raises; remaining occurrences in the codebase
      are being migrated opportunistically.

      **DO NOT FLAG:**
      - Existing `raise ClickException(...)` not touched by the current PR (legacy code)
      - `except ClickException` catch clauses (still needed to catch from Click internals)

      **WHAT TO FLAG:**
      - Any **new** `raise ClickException(...)` or `raise click.ClickException(...)` introduced in the diff
      - Importing `ClickException` in a new file when the import is not used solely in an `except` clause

      ❌ **BAD:**
      ```python
      import click
      from click import ClickException

      raise click.ClickException(f"Image registry URL is malformed: {url}")
      raise ClickException("No active connection — check your credentials")
      raise ClickException(f"SQL execution failed: {e}")
      ```

      ✅ **GOOD:**
      ```python
      from snowflake.cli.api.exceptions import (
          CliArgumentError,
          CliConnectionError,
          CliSqlError,
      )

      raise CliArgumentError(f"Image registry URL is malformed: {url}")
      raise CliConnectionError("No active connection — check your credentials")
      raise CliSqlError(f"SQL execution failed: {e}")
      ```

  - id: snowflake-cli-actionable-error-messages
    status: shadow
    rule: |
      **OBJECTIVE**: Error messages should tell the user both what went wrong and what to do about it.
      Messages that state only a fact leave users guessing.

      **REQUIREMENT**: When raising `CliError` or any subclass, include a corrective hint where one
      exists. The message format should be: *what happened* + *how to fix it*.

      **DO NOT FLAG:**
      - Errors where the fix is self-evident (e.g. `"Value must not be empty"`)
      - Server-relayed errors where the fix is server-side and unknown to the CLI
      - Errors in test code

      **WHAT TO FLAG:**
      - `raise CliError(f"File {path} not found")` — no guidance on what to do
      - `raise CliError("Invalid configuration")` — no detail on which field is invalid
      - Short one-word errors like `raise CliError("Unauthorized")` with no next-step hint

      ❌ **BAD:**
      ```python
      raise CliError(f"File {path} not found")
      raise CliError(f"Connection {name} does not exist")
      ```

      ✅ **GOOD:**
      ```python
      raise CliError(f"File {path} not found. Check the path and try again.")
      raise CliError(
          f"Connection '{name}' does not exist. "
          "Run 'snow connection list' to see available connections."
      )
      ```

  - id: snowflake-cli-logging-percent-style
    status: shadow
    rule: |
      **OBJECTIVE**: Use `%`-style formatting in `logging` calls — not f-strings or `.format()` —
      so the string is only built when the message is actually emitted (performance), and to align
      with the project convention.

      **REQUIREMENT**: All `log.debug(...)`, `log.info(...)`, `log.warning(...)`, `log.error(...)`,
      `log.critical(...)`, and `log.exception(...)` calls must use positional `%s` arguments.

      **DO NOT FLAG:**
      - f-strings outside of logging calls (fine everywhere else)
      - `logging.basicConfig(format=...)` — that is a format pattern string, not a log message
      - Test code asserting on log output

      **WHAT TO FLAG:**
      - `log.debug(f"Processing {n} items")` — f-string argument in a logging call
      - `log.info("Result: {}".format(result))` — `.format()` in a logging call

      ❌ **BAD:**
      ```python
      log.debug(f"Processing {len(items)} items from {source}")
      log.info("Connected to account: {}".format(account))
      ```

      ✅ **GOOD:**
      ```python
      log.debug("Processing %s items from %s", len(items), source)
      log.info("Connected to account: %s", account)
      ```
