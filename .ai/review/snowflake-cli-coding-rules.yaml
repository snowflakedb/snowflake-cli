id: snowflake-cli-coding-rules
friendly_name: "Snowflake CLI - Coding Rules"
status: shadow
allowed_folders:
  - "src/"
excluded_folders: []
allowed_file_extensions:
  - ".py"
rules:
  - id: snowflake-cli-sql-injection-prevention
    status: shadow
    rule: |
      **OBJECTIVE**: Prevent SQL injection when building Snowflake SQL from identifiers,
      config values, or other externally-influenced input.

      **REQUIREMENT**: Never f-string-interpolate raw identifiers or values into SQL. Wrap
      object identifiers with `FQN.sql_identifier` / `to_identifier` / `to_quoted_identifier`,
      quote string values with `to_string_literal()`, escape `SHOW ... LIKE` patterns with
      `identifier_to_show_like_pattern`, and use bind parameters (`%s`) for DML/`CALL`. Never
      hand-roll escaping such as `value.replace("'", "\\'")`. Apply the safe form consistently
      to every interpolated component (warehouse, compute pool, role, alias, EAI names), not
      just one. All helpers live in `snowflake.cli.api.project.util`.

      ❌ **BAD:**
      ```python
      query = f'EXECUTE DCM PROJECT {project_id} PURGE AS "{alias}"'
      cursor.execute(f"CALL SYSTEM$GET_TOKEN('{fqn}', false)")
      set_properties.append(f"QUERY_WAREHOUSE = {self.model.query_warehouse}")
      cursor.execute(f"SHOW INTEGRATIONS LIKE '{name}%'")
      ```

      ✅ **GOOD:**
      ```python
      from snowflake.cli.api.project.util import (
          identifier_to_show_like_pattern,
          to_identifier,
          to_string_literal,
      )

      query = f"EXECUTE DCM PROJECT {project_id.sql_identifier} PURGE"
      if alias:
          query += f" AS {to_string_literal(alias)}"
      cursor.execute("CALL SYSTEM$GET_TOKEN(%s, false)", (fqn,))
      set_properties.append(f"QUERY_WAREHOUSE = {to_identifier(self.model.query_warehouse)}")
      cursor.execute(f"SHOW INTEGRATIONS LIKE '{identifier_to_show_like_pattern(name)}%'")
      ```

  - id: snowflake-cli-feature-flag-no-internal-ids
    status: shadow
    rule: |
      **OBJECTIVE**: Feature flag names must use descriptive, capability-focused names that are
      safe to expose publicly. They must not embed internal tracking identifiers.

      **REQUIREMENT**: Both the Python enum member name and the string argument passed to
      `BooleanFlag(...)` must describe what the feature does, not reference internal tickets,
      issue numbers, or system parameter names. Specifically, flag names must not contain:
      - Numeric sequences of 4 or more digits that represent issue or tracking IDs
        (e.g., `3659937`, `12345`)
      - Prefixes or segments that identify an internal fix or issue reference, such as
        `FIX_`, `SNOW_<digits>`, or any pattern of the form `_<digits>_`

      Flag names are exposed to users as environment variable names
      (`SNOWFLAKE_CLI_FEATURES_<NAME>`) and appear in help output and documentation.
      Embedding internal identifiers leaks implementation details and is confusing to
      external users.

      ❌ **BAD:**
      ```python
      ENABLE_FIX_3659937_DBT_PROJECTS_PROFILES_FILE = BooleanFlag(
          "ENABLE_FIX_3659937_DBT_PROJECTS_PROFILES_FILE", False
      )
      ENABLE_SNOW_12345_SPCS_BUILD_IMAGE = BooleanFlag(
          "ENABLE_SNOW_12345_SPCS_BUILD_IMAGE", False
      )
      ```

      ✅ **GOOD:**
      ```python
      ENABLE_DBT_PROJECTS_PROFILES_FILE_PRECEDENCE = BooleanFlag(
          "ENABLE_DBT_PROJECTS_PROFILES_FILE_PRECEDENCE", False
      )
      ENABLE_SPCS_BUILD_IMAGE = BooleanFlag("ENABLE_SPCS_BUILD_IMAGE", False)
      ```

  - id: snowflake-cli-use-cli-error-not-click-exception
    status: shadow
    rule: |
      **OBJECTIVE**: Prevent `click.ClickException` from being introduced in new or modified
      code. The project uses the `CliError` hierarchy, which provides structured exit-codes and
      typed subclasses that carry more context than a bare `ClickException`.

      **REQUIREMENT**: Raise `CliError` or one of its subclasses instead of
      `click.ClickException` or `ClickException`. When a change already touches a line that
      raises `ClickException`, migrate that raise in the same PR. Choose the most specific
      subclass for the situation — subclasses and their intended use are in
      `src/snowflake/cli/api/exceptions.py`:

      - `CliArgumentError` — bad CLI argument or input value
      - `CliConnectionError` — cannot establish or use a Snowflake connection
      - `CliCommunicationError` — network or protocol error after connection
      - `CliSqlError` — SQL execution failure
      - `CliError` — generic, when no specific subclass fits

      Do not introduce new `ClickException` raises; remaining occurrences in the codebase
      are being migrated opportunistically.

      ❌ **BAD:**
      ```python
      import click
      from click import ClickException

      raise click.ClickException(f"Image registry URL is malformed: {url}")
      raise ClickException("No active connection — check your credentials")
      raise ClickException(f"SQL execution failed: {e}")
      ```

      ✅ **GOOD:**
      ```python
      from snowflake.cli.api.exceptions import (
          CliArgumentError,
          CliConnectionError,
          CliSqlError,
      )

      raise CliArgumentError(f"Image registry URL is malformed: {url}")
      raise CliConnectionError("No active connection — check your credentials")
      raise CliSqlError(f"SQL execution failed: {e}")
      ```
