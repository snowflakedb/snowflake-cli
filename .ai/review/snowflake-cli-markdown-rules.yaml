id: snowflake-cli-markdown-rules
friendly_name: "Snowflake CLI - Release Notes Review Rules"
status: enabled
allowed_folders: []
excluded_folders: []
allowed_file_extensions:
  - ".md"
rules:
  - id: snowflake-cli-release-notes-discipline
    rule: |
      **SCOPE**: This rule applies ONLY to files named `RELEASE-NOTES.md`. If the file you are reviewing has any other name, make no comments and stop.

      **OBJECTIVE**: Keep `RELEASE-NOTES.md` correct, user-focused, and free of misplaced or noise entries.

      **REQUIREMENT**: Add a release-notes entry only for user-facing product changes. Describe the user-visible
      impact concisely (1–2 sentences); do not leak internal implementation details (function names, system
      functions). Do not add entries for internal/CI-only changes (e.g., CI pipeline configuration, test
      infrastructure, internal code refactors with no user-visible effect), for features in Private Preview, or
      for work that is not yet enabled. Remove duplicates of entries that already shipped in a released version.

      **Where to place new entries — two valid patterns:**

      1. **Normal case (almost always)**: Place the entry under `# Unreleased version` as the last item in the
         correct subsection (`## Backward incompatibility`, `## Deprecations`, `## New additions`, or
         `## Fixes and improvements`).

      2. **Patch-release exception**: When a PR is preparing a patch release, it may add a brand-new
         `# vX.Y.Z` section (where Z > 0, i.e. a patch version) placed **immediately before the base
         version it patches** — e.g., `# v3.22.1` directly above `# v3.22.0`. When the patch is for
         the most recently released minor series, this naturally places it right after
         `# Unreleased version`; when a newer minor has already been released, the patch section sits
         below it, grouped with its series. A patch-release section MUST contain ONLY
         `## Fixes and improvements` entries. Flag it if the new versioned section contains
         `## New additions`, `## Deprecations`, or `## Backward incompatibility` — those belong in a
         minor or major release, not a patch.

      Never add entries under an already-released `# vX.Y.Z` heading that is not the brand-new section
      introduced by this PR.

      **Package and dependency version upgrades are user-facing changes** — they can affect runtime behaviour,
      security posture, and compatibility, so they **must** be included in release notes. Do not flag or remove
      dependency upgrade entries.

      ❌ **BAD (entry placed under an existing released version instead of Unreleased):**
      ```markdown
      # Unreleased version
      ## Fixes and improvements

      # v3.17.0
      ## Fixes and improvements
      * Fixed `snow connection list` crashing with `AttributeError`.
      <!-- Wrong: entry added to an existing released version; must go under # Unreleased version -->
      ```

      ❌ **BAD (CI-only and internal-implementation entries under Unreleased):**
      ```markdown
      # Unreleased version
      ## New additions
      * Updated GitHub Actions CI pipeline to use reusable workflow definitions.  <!-- CI-only: no user impact -->

      ## Fixes and improvements
      * Updated `_resolve_connection_params` to call `ConfigManager.fetch_raw_dict` instead of
        the deprecated `ConfigManager.load_legacy_format`.  <!-- internal refactor, leaks function names -->
      ```

      ❌ **BAD (patch-release section contains new additions — not allowed in a patch):**
      ```markdown
      # Unreleased version
      ## Fixes and improvements
      * Some unreleased fix.

      # v3.17.1
      ## New additions
      * Added `--watch` flag to `snow app open`.
      <!-- Wrong: patch-release sections must contain only ## Fixes and improvements, not ## New additions -->

      # v3.17.0
      ## New additions
      ...
      ```

      ❌ **BAD (patch section misplaced — inserted at the top instead of immediately before its base version):**
      ```markdown
      # Unreleased version
      ## Fixes and improvements
      * Some unreleased fix.

      # v3.22.1
      <!-- Wrong: v3.22.1 must go immediately before v3.22.0, not above the newer v3.23.0 -->
      ## Fixes and improvements
      * Fixed `snow streamlit deploy` incorrectly unsetting governance tags on redeploy.

      # v3.23.0
      ## New additions
      * Added `snow notebook execute` command.

      # v3.22.0
      ## New additions
      ...
      ```

      ✅ **GOOD (normal PR — entries go under Unreleased):**
      ```markdown
      # Unreleased version
      ## Fixes and improvements
      * Fixed `snow connection list` crashing with `AttributeError` when `config.toml`
        contains a scalar value directly under `[connections]`.
      * Updated `snowflake-connector-python` to version 4.5.0.
      * Upgraded `pip` from 24.0 to 24.2.
      ```

      ✅ **GOOD (patch-release PR — patch section placed immediately before its base version):**
      ```markdown
      # Unreleased version
      ## Fixes and improvements
      * Some unreleased fix.

      # v3.23.0
      ## New additions
      * Added `snow notebook execute` command.

      # v3.22.1
      <!-- Correct: placed immediately before v3.22.0, its base version — even though v3.23.0 is newer -->

      ## Fixes and improvements
      * Fixed `snow streamlit deploy` incorrectly unsetting governance tags on redeploy.

      # v3.22.0
      ## New additions
      ...
      ```

  - id: snowflake-cli-security-fix-vagueness
    rule: |
      **SCOPE**: This rule applies ONLY to files named `RELEASE-NOTES.md`. If the file you are reviewing has any other name, make no comments and stop.

      **OBJECTIVE**: Prevent release-notes entries for security fixes from revealing exploitable implementation details.

      **REQUIREMENT**: When an entry describes a security fix (injection flaws, path traversal, authentication bypass, privilege escalation, input sanitization, etc.), describe the user-visible improvement only. Do not reveal: the attack vector, the name of the vulnerable field or parameter, what bypass or exploit was possible, or what data could be exposed. Use neutral language such as "improved validation", "improved sanitization", or "improved handling".

      ❌ **BAD:**
      ```markdown
      * Fixed a SQL injection in the `query` field of `snowflake.yml` that allowed bypassing row-level security and executing arbitrary SQL.
      * Fixed path traversal in `--artifact-dir` that allowed reading files outside the project root.
      * Fixed an authentication bypass in `snow connection test` when using token-based auth that allowed skipping MFA enforcement.
      ```

      ✅ **GOOD:**
      ```markdown
      * Improved sanitization of user-provided values in `snowflake.yml` project configuration.
      * Improved validation of file path inputs in artifact-related commands.
      * Improved robustness of connection authentication handling.
      ```
